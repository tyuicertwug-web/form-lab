function planDays(){let n=Number(d.days||3);let base=n===2?[['Верх тела A',upperA],['Низ тела + корпус',lowerA]]:n===3?[['Верх тела A',upperA],['Низ тела + корпус',lowerA],['Верх тела B',upperB]]:n===4?[['Верх тела A',upperA],['Низ тела A',lowerA],['Верх тела B',upperB],['Низ тела B',lowerB]]:[['Верх A',upperA],['Низ A',lowerA],['Верх B',upperB],['Низ B',lowerB],['Верх C / аксессуары',upperA.slice(2,8)]];let role=football[d.position]||football['Играю на разных позициях'];if(n>=3)base.push(['Футбольная позиционная работа',role]);return base}
function isExcluded(name){let a=d.exclude||[];return (a.includes('Становая тяга')&&/станов|deadlift/i.test(name))||(a.includes('Румынская тяга')&&/румын/i.test(name))||(a.includes('Любые приседания')&&/присед/i.test(name))||(a.includes('Болгарские приседания')&&/болгар/i.test(name))||(a.includes('Выпады')&&/выпад/i.test(name))||(a.includes('Гиперэкстензия')&&/гиперэкстенз/i.test(name))||(a.includes('Прыжки на тумбу')&&/тумбу/i.test(name))||(a.includes('Брусья')&&/брусья/i.test(name))||(a.includes('Жим над головой')&&/жим гантелей сидя|жим плеч/i.test(name))||(a.includes('Подтягивания')&&/подтягивания/i.test(name))}
function plan(){let days=planDays().map(([name,arr],i)=>{let ex=arr.filter(e=>!isExcluded(e[0]));return `<section class="daycard"><div class="dayhead"><div><div class="daytag">SESSION ${String(i+1).padStart(2,'0')}</div><div class="dayname">${esc(name)}</div></div><div class="pill">${d.duration||'90+ минут'}</div></div>${ex.map((e,j)=>{let id=i+'-'+j;return `<div class="ex" data-ex="${id}"><div class="check ${done[id]?'done':''}">${done[id]?'✓':''}</div><div style="flex:1"><div class="exname ${done[id]?'done':''}">${esc(e[0])}</div><div class="meta"><b>${e[1]} подхода × ${e[2]}</b><br>Отдых: ${esc(e[3])}</div><div class="tip">${esc(e[4])}</div></div></div>`}).join('')}</section>`}).join('');let count=Object.values(done).filter(Boolean).length;return `<div class="eyebrow">ТВОЙ ПЛАН / ВЕРСИЯ 1</div><h1 class="hero">${esc(d.name||'Твой')}<br>performance plan.</h1><p class="muted">${esc(d.position||'Футбол')} · ${esc(d.goal||'Общая сила')} · ${d.days||3} силовых дня</p><div class="stats"><div class="stat"><b>${d.days||3}</b><span>ДНЕЙ В ЗАЛЕ</span></div><div class="stat"><b>${count}</b><span>ОТМЕЧЕНО</span></div><div class="stat"><b>${esc(d.duration||'90+')}</b><span>ВРЕМЯ</span></div></div><div class="notice"><b>Как прогрессировать</b><p>Записывай вес и повторы. Если все рабочие подходы выполнены в верхней границе диапазона с чистой техникой и 1–3 повторами в запасе, увеличь вес на минимальный доступный шаг. Не тестируй максимум каждую неделю. Спринты и прыжки выполняй свежим, с полным отдыхом; не превращай их в кардио.</p></div>${days}<div class="notice"><b>Разминка и футбольная нагрузка</b><p>Начни с 5–8 минут лёгкой разминки, затем сделай 2–4 постепенных разминочных подхода перед первым тяжёлым упражнением. Не ставь тяжёлую тренировку ног накануне матча. Позиционные блоки — дополнение к командной работе, а не замена полевых тренировок. Прыжки/спринты делай под наблюдением тренера и прекращай при боли или ухудшении техники.</p></div><button class="secondary" id="reset">СБРОСИТЬ ОТМЕТКИ</button><button class="secondary" id="edit">ИЗМЕНИТЬ АНКЕТУ</button><p class="hint">Программа пока шаблонная: анкету можно заполнить полностью, чтобы точнее адаптировать объём. При травме, боли или медицинских ограничениях сначала согласуй нагрузку со специалистом. Если тебе меньше 18 лет, тяжёлые движения и взрывную работу выполняй под контролем квалифицированного тренера.</p><div class="footer">IRON PLAN · BUILD THE ATHLETE</div>`}
function progress(){let total=Object.keys(done).length,completed=Object.values(done).filter(Boolean).length;return `<div class="eyebrow">TRACK / 12 WEEK CYCLE</div><h1 class="hero">Прогресс<br>без гаданий.</h1><p class="muted">Сохраняй показатели здесь или в заметках после каждой тренировки. Повторяй замеры раз в 2–4 недели, а не каждый день.</p><div class="stats"><div class="stat"><b>${completed}</b><span>ОТМЕЧЕНО</span></div><div class="stat"><b>${esc(d.bench||'—')}</b><span>ТЕКУЩИЙ ЖИМ</span></div><div class="stat"><b>${esc(d.benchGoal||'—')}</b><span>ЦЕЛЬ ПО ЖИМУ</span></div></div><div class="card"><label class="label">ЗАПИСЬ ПОСЛЕ ТРЕНИРОВКИ</label><textarea id="log" class="field" rows="5" placeholder="Дата — упражнение — вес × повторы — запас повторов — самочувствие"></textarea><button class="primary" id="saveLog">СКОПИРОВАТЬ / СОХРАНИТЬ ЗАМЕТКУ</button><div id="logs" class="small"></div></div><div class="card"><b>Что отслеживать для футбола</b><p class="muted">• Жим и подтягивания: вес × повторы при одинаковой технике.<br>• Скорость: 10–20 м, только если есть безопасный способ измерения.<br>• Прыжок: одинаковый способ замера и одинаковая разминка.<br>• Восстановление: сон, усталость, боль, качество футбольной тренировки.<br>• Не делай выводы по одному неудачному дню.</p></div><button class="secondary" id="edit">ОБНОВИТЬ АНКЕТУ</button><div class="footer">CONSISTENCY > RANDOM MAXES</div>`}
function getProfile(){return JSON.parse(localStorage.getItem('ipf-profile')||'null')}
function profileView(){let p=getProfile();return `<div class="eyebrow">ACCOUNT / PERSONAL SPACE</div><h1 class="hero">Твой<br>профиль.</h1><p class="muted">Профиль хранит настройки и историю на этом устройстве. Регистрация по нику и паролю в этой версии локальная: она не создаёт защищённый интернет-аккаунт и не синхронизирует данные между устройствами.</p>${p?`<div class="card"><div class="daytag">SIGNED IN LOCALLY</div><h2>${esc(p.nickname)}</h2><p class="muted">${esc(p.email||'Локальный профиль')}</p><div class="stats"><div class="stat"><b>${JSON.parse(localStorage.getItem('ipf-logs')||'[]').length}</b><span>ЗАПИСЕЙ</span></div><div class="stat"><b>${Object.values(done).filter(Boolean).length}</b><span>УПРАЖНЕНИЙ</span></div><div class="stat"><b>${esc(d.position||'—')}</b><span>ПОЗИЦИЯ</span></div></div><button class="secondary" id="logout">ВЫЙТИ ИЗ ПРОФИЛЯ</button></div>`:`<div class="card"><h2>Создать профиль</h2><label class="label">НИК</label><input class="field" id="authNick" autocomplete="username" placeholder="Например, striker_10"><label class="label">EMAIL (НЕОБЯЗАТЕЛЬНО В ЛОКАЛЬНОМ РЕЖИМЕ)</label><input class="field" id="authEmail" type="email" autocomplete="email" placeholder="name@example.com"><label class="label">ПАРОЛЬ</label><input class="field" id="authPass" type="password" autocomplete="new-password" placeholder="Минимум 8 символов"><button class="primary" id="register">СОЗДАТЬ ЛОКАЛЬНЫЙ ПРОФИЛЬ</button><div class="hr"></div><h2>Уже есть профиль на этом устройстве?</h2><label class="label">НИК</label><input class="field" id="loginNick" autocomplete="username" placeholder="Твой ник"><label class="label">ПАРОЛЬ</label><input class="field" id="loginPass" type="password" autocomplete="current-password" placeholder="Пароль"><button class="secondary" id="login">ВОЙТИ</button><div class="hr"></div><h2>Вход через Google</h2><p class="tiny">Для настоящего Google-входа нужен Firebase-проект и его конфигурация в коде. Кнопка ниже покажет инструкцию; без настройки Google-вход не заработает.</p><button class="secondary" id="googleLogin">ПОДКЛЮЧИТЬ GOOGLE ВХОД</button><div id="authMsg" class="tiny"></div></div>`}<div class="notice"><b>Важно о безопасности</b><p>Не используй пароль от Google или других сайтов. Локальный профиль хранится в данных Safari и может пропасть при очистке данных сайта. Это прототип, а не серверная система аккаунтов.</p></div><button class="secondary" id="exportData">ЭКСПОРТИРОВАТЬ МОИ ДАННЫЕ JSON</button><button class="secondary" id="importData">ИМПОРТИРОВАТЬ ДАННЫЕ JSON</button><input id="importFile" type="file" accept="application/json" class="hidden"><div class="footer">YOUR DATA · YOUR PROGRESS</div>`}
function workoutView(){let logs=JSON.parse(localStorage.getItem('ipf-logs')||'[]');return `<div class="eyebrow">TRAINING LOG / SESSION DATA</div><h1 class="hero">Записывай<br>каждую тренировку.</h1><p class="muted">Фиксируй упражнения, подходы, повторения, рабочие веса и самочувствие. История остаётся в этом браузере.</p><div class="card"><label class="label">ДАТА</label><input class="field" id="logDate" type="date" value="${new Date().toISOString().slice(0,10)}"><label class="label">ТИП ТРЕНИРОВКИ</label><select id="logType" class="field"><option>Верх тела A</option><option>Верх тела B</option><option>Низ тела + корпус</option><option>Футбольная позиционная работа</option><option>Скорость / прыжки</option><option>Футбольная тренировка / матч</option><option>Другое</option></select><label class="label">УПРАЖНЕНИЯ И РАБОЧИЕ ВЕСА</label><textarea id="logExercises" class="field" rows="5" placeholder="Жим лёжа — 60 кг: 8 / 8 / 7&#10;Тяга блока — 50 кг: 12 / 11 / 10"></textarea><div class="grid2"><div><label class="label">ДЛИТЕЛЬНОСТЬ, МИН</label><input id="logDuration" class="field" type="number" min="1" max="300" placeholder="90"></div><div><label class="label">УСИЛИЕ (RPE 1–10)</label><input id="logRpe" class="field" type="number" min="1" max="10" placeholder="7"></div></div><label class="label">САМОЧУВСТВИЕ / БОЛЬ / ЗАМЕТКИ</label><textarea id="logNotes" class="field" rows="3" placeholder="Сон, усталость, техника, боль — если была"></textarea><button class="primary" id="addWorkout">СОХРАНИТЬ ТРЕНИРОВКУ</button><button class="secondary" id="exportLogs">ЭКСПОРТИРОВАТЬ ИСТОРИЮ CSV</button></div><div class="section">История (${logs.length})</div>${logs.length?logs.map((x,i)=>`<div class="record"><div class="dayhead"><div><div class="daytag">${esc(x.date)}</div><strong>${esc(x.type)}</strong></div><button class="opt" data-del-log="${i}">УДАЛИТЬ</button></div><div class="meta">${esc(x.exercises||'Без списка упражнений')}<br>Время: ${esc(x.duration||'—')} мин · RPE: ${esc(x.rpe||'—')}<br>${esc(x.notes||'')}</div></div>`).join(''):`<p class="muted">Пока записей нет. После первой тренировки добавь сюда результаты.</p>`}<div class="footer">LOG THE WORK · REVIEW THE DATA</div>`}
function nutritionView(){return `<div class="eyebrow">NUTRITION / ESTIMATE</div><h1 class="hero">КБЖУ под<br>твою цель.</h1><p class="muted">Это ориентировочная оценка, а не медицинское назначение. Для подростков, особенно при активном футболе и силовых, не используй агрессивный дефицит калорий: рост и восстановление важнее сушки.</p><div class="card"><div class="grid2"><div><label class="label">ВОЗРАСТ</label><input id="nAge" class="field" type="number" min="10" max="100" value="${esc(d.age||16)}"></div><div><label class="label">ПОЛ ДЛЯ ФОРМУЛЫ</label><select id="nSex" class="field"><option value="m">Мужской</option><option value="f">Женский</option><option value="x">Не указывать</option></select></div><div><label class="label">РОСТ, СМ</label><input id="nHeight" class="field" type="number" min="100" max="240" value="${esc(d.height||175)}"></div><div><label class="label">ВЕС, КГ</label><input id="nWeight" class="field" type="number" min="25" max="300" step=".1" value="${esc(d.weight||70)}"></div></div><label class="label">ОБЩАЯ АКТИВНОСТЬ</label><select id="nActivity" class="field"><option value="1.4">Лёгкая — 1–2 тренировки в неделю</option><option value="1.55" selected>Средняя — 3–4 тренировки в неделю</option><option value="1.725">Высокая — 5–6 тренировок в неделю</option><option value="1.9">Очень высокая — футбол + зал почти ежедневно</option></select><label class="label">ЦЕЛЬ</label><select id="nGoal" class="field"><option value="maintain">Поддерживать вес и восстановление</option><option value="gain">Постепенный набор мышц</option><option value="lose">Снижение веса (не рекомендуется без специалиста несовершеннолетним)</option></select><label class="label">КАКОЙ ТИП ОЦЕНКИ?</label><select id="nMethod" class="field"><option value="auto">Рассчитать по формуле Mifflin–St Jeor</option><option value="manual">Я уже знаю свою норму калорий</option></select><div id="manualWrap" class="hidden"><label class="label">ТВОЯ НОРМА ККАЛ</label><input id="nManual" class="field" type="number" placeholder="Например, 2800"></div><button class="primary" id="calcNutrition">РАССЧИТАТЬ КБЖУ</button><div id="nutritionResult"></div></div><div class="notice"><b>Как понимать результат</b><p>Белок — ориентир для активного человека, жиры не стоит урезать чрезмерно, углеводы поддерживают футбол и восстановление. Расход энергии по формуле может ошибаться на сотни килокалорий. Сверяй расчёт с самочувствием, динамикой веса за несколько недель и спортивными результатами. При возрасте до 18 лет лучше обсуждать изменение веса с врачом или спортивным диетологом.</p></div><div class="footer">FUEL TO PERFORM</div>`}
function wireProfile(){let msg=document.getElementById('authMsg');let reg=document.getElementById('register');if(reg)reg.onclick=async()=>{let nick=document.getElementById('authNick').value.trim(),pass=document.getElementById('authPass').value,email=document.getElementById('authEmail').value.trim();if(nick.length<3||pass.length<8){msg.textContent='Нужен ник минимум 3 символа и пароль минимум 8 символов.';return}let users=JSON.parse(localStorage.getItem('ipf-users')||'{}');let key=nick.toLowerCase();if(users[key]){msg.textContent='Такой ник уже зарегистрирован на этом устройстве. Войди или выбери другой.';return}let salt=crypto.getRandomValues(new Uint8Array(16));let enc=new TextEncoder();let keyObj=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveBits']);let bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:120000,hash:'SHA-256'},keyObj,256);users[key]={nickname:nick,email,salt:Array.from(salt),hash:Array.from(new Uint8Array(bits))};localStorage.setItem('ipf-users',JSON.stringify(users));localStorage.setItem('ipf-profile',JSON.stringify({nickname:nick,email}));msg.textContent='Профиль создан на этом устройстве.';render()};let login=document.getElementById('login');if(login)login.onclick=async()=>{let nick=document.getElementById('loginNick').value.trim(),pass=document.getElementById('loginPass').value,users=JSON.parse(localStorage.getItem('ipf-users')||'{}'),u=users[nick.toLowerCase()];if(!u){msg.textContent='Профиль не найден на этом устройстве.';return}let keyObj=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);let bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new Uint8Array(u.salt),iterations:120000,hash:'SHA-256'},keyObj,256);let hash=Array.from(new Uint8Array(bits));if(hash.join(',')!==u.hash.join(',')){msg.textContent='Неверный пароль.';return}localStorage.setItem('ipf-profile',JSON.stringify({nickname:u.nickname,email:u.email}));render()};let out=document.getElementById('logout');if(out)out.onclick=()=>{localStorage.removeItem('ipf-profile');render()};let google=document.getElementById('googleLogin');if(google)google.onclick=()=>{msg.textContent='Google-вход требует настройки Firebase Authentication: создай проект на console.firebase.google.com, включи Authentication → Google и добавь домен tyuicertwug-web.github.io в Authorized domains. Затем добавь Firebase web config в index.html. До этого кнопка не может выполнить настоящий вход.'};let ex=document.getElementById('exportData');if(ex)ex.onclick=()=>{let obj={profile:getProfile(),survey:d,workouts:JSON.parse(localStorage.getItem('ipf-logs')||'[]'),progress:done,notes:JSON.parse(localStorage.getItem('ipf-logs')||'[]')};downloadFile('iron-plan-backup.json',JSON.stringify(obj,null,2),'application/json')};let imp=document.getElementById('importData');if(imp)imp.onclick=()=>document.getElementById('importFile').click();let file=document.getElementById('importFile');if(file)file.onchange=async()=>{try{let obj=JSON.parse(await file.files[0].text());if(obj.survey)d=obj.survey;if(obj.progress)done=obj.progress;if(obj.workouts)localStorage.setItem('ipf-logs',JSON.stringify(obj.workouts));save();render();alert('Данные импортированы.')}catch(e){alert('Не удалось прочитать JSON-файл.')}}}
function downloadFile(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function wireWorkout(){let add=document.getElementById('addWorkout');if(add)add.onclick=()=>{let x={date:document.getElementById('logDate').value,type:document.getElementById('logType').value,exercises:document.getElementById('logExercises').value.trim(),duration:document.getElementById('logDuration').value,rpe:document.getElementById('logRpe').value,notes:document.getElementById('logNotes').value.trim()};if(!x.exercises){alert('Добавь хотя бы одно упражнение или результат.');return}let logs=JSON.parse(localStorage.getItem('ipf-logs')||'[]');logs.unshift(x);localStorage.setItem('ipf-logs',JSON.stringify(logs));render()};document.querySelectorAll('[data-del-log]').forEach(b=>b.onclick=()=>{let logs=JSON.parse(localStorage.getItem('ipf-logs')||'[]');logs.splice(Number(b.dataset.delLog),1);localStorage.setItem('ipf-logs',JSON.stringify(logs));render()});let ex=document.getElementById('exportLogs');if(ex)ex.onclick=()=>{let logs=JSON.parse(localStorage.getItem('ipf-logs')||'[]');let csv='date,type,exercises,duration,rpe,notes\n'+logs.map(x=>[x.date,x.type,x.exercises,x.duration,x.rpe,x.notes].map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');downloadFile('iron-plan-workouts.csv',csv,'text/csv;charset=utf-8')}}
function wireNutrition(){let method=document.getElementById('nMethod'),wrap=document.getElementById('manualWrap');if(!method)return;method.onchange=()=>wrap.classList.toggle('hidden',method.value!=='manual');document.getElementById('calcNutrition').onclick=()=>{let age=+document.getElementById('nAge').value,h=+document.getElementById('nHeight').value,w=+document.getElementById('nWeight').value,sex=document.getElementById('nSex').value,activity=+document.getElementById('nActivity').value,goal=document.getElementById('nGoal').value;if(!age||!h||!w||age<10||h<100||w<25){alert('Проверь возраст, рост и вес.');return}let bmr=10*w+6.25*h-5*age+(sex==='m'?5:sex==='f'?-161:-78),base=method.value==='manual'?+document.getElementById('nManual').value:bmr*activity;if(!base||base<500){alert('Введи корректную норму калорий.');return}let kcal=base;if(goal==='gain')kcal=base+(age<18?100:200);if(goal==='lose')kcal=base-(age<18?0:250);let protein=Math.round(w*1.6),fat=Math.round(w*0.9),carb=Math.max(0,Math.round((kcal-protein*4-fat*9)/4));let minor=age<18;document.getElementById('nutritionResult').innerHTML=`<div class="hr"></div><div class="daytag">ОРИЕНТИРОВОЧНЫЙ РАСЧЁТ</div><div class="kcal">${Math.round(kcal).toLocaleString('ru-RU')} ккал/день</div><div class="stats"><div class="stat"><b>${protein} г</b><span>БЕЛКИ</span></div><div class="stat"><b>${carb} г</b><span>УГЛЕВОДЫ</span></div><div class="stat"><b>${fat} г</b><span>ЖИРЫ</span></div></div><p class="tiny">Оценочный базовый обмен: ${Math.round(bmr)} ккал; с коэффициентом активности: ${Math.round(bmr*activity)} ккал. Макросы округлены, фактические потребности могут отличаться.</p>${minor?'<div class="notice"><b>Возраст до 18 лет</b><p>Формулы для взрослых не учитывают рост и развитие. Не используй дефицит калорий или целенаправленное похудение без врача/спортивного диетолога. Для футболиста важны достаточная энергия, сон и восстановление.</p></div>':''}<button class="secondary" id="saveNutrition">СОХРАНИТЬ РАСЧЁТ В ЗАМЕТКИ</button>`;document.getElementById('saveNutrition').onclick=()=>{let logs=JSON.parse(localStorage.getItem('ipf-logs')||'[]');logs.unshift({date:new Date().toISOString().slice(0,10),type:'Питание / расчёт КБЖУ',exercises:`${Math.round(kcal)} ккал; Б ${protein} г; У ${carb} г; Ж ${fat} г`,notes:'Ориентировочный расчёт, не медицинская рекомендация'});localStorage.setItem('ipf-logs',JSON.stringify(logs));alert('Расчёт сохранён в дневнике.')}}}
function render(){save();['surveyTab','planTab','progressTab','logTab','nutritionTab','profileTab'].forEach((id)=>{let el=document.getElementById(id);if(el)el.classList.toggle('active',id.replace('Tab','')===tab)});document.getElementById('app').innerHTML=tab==='survey'?survey():tab==='plan'?plan():tab==='progress'?progress():tab==='log'?workoutView():tab==='nutrition'?nutritionView():profileView();document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{d[b.dataset.choice]=b.dataset.val;save();render()});document.querySelectorAll('[data-multi]').forEach(b=>b.onclick=()=>{let k=b.dataset.multi,v=d[k]||[],x=b.dataset.val;d[k]=v.includes(x)?v.filter(y=>y!==x):[...v,x];save();render()});document.querySelectorAll('[data-input]').forEach(el=>el.oninput=()=>{d[el.dataset.input]=el.value;save()});let prev=document.getElementById('prev');if(prev)prev.onclick=()=>{step=Math.max(0,step-1);render()};let next=document.getElementById('next');if(next)next.onclick=()=>{save();if(step<sections.length-1){step++;render();scrollTo(0,0)}else{tab='plan';render();scrollTo(0,0)}};document.querySelectorAll('[data-ex]').forEach(el=>el.onclick=()=>{done[el.dataset.ex]=!done[el.dataset.ex];save();render()});let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('Сбросить отметки выполненных упражнений?')){done={};save();render()}};document.querySelectorAll('#edit').forEach(el=>el.onclick=()=>{tab='survey';render();scrollTo(0,0)});let sl=document.getElementById('saveLog');if(sl)sl.onclick=()=>{let logs=JSON.parse(localStorage.getItem('ipf-logs')||'[]');let txt=document.getElementById('log').value.trim();if(txt){logs.unshift(txt);localStorage.setItem('ipf-logs',JSON.stringify(logs.slice(0,30)));document.getElementById('logs').innerHTML=logs.slice(0,8).map(x=>'• '+esc(x)).join('<br>');document.getElementById('log').value=''}};if(tab==='progress'){let logs=JSON.parse(localStorage.getItem('ipf-logs')||'[]');document.getElementById('logs').innerHTML=logs.slice(0,8).map(x=>'• '+esc(x)).join('<br>')}if(tab==='profile')wireProfile();if(tab==='log')wireWorkout();if(tab==='nutrition')wireNutrition()}
document.getElementById('surveyTab').onclick=()=>{tab='survey';render();scrollTo(0,0)};document.getElementById('planTab').onclick=()=>{tab='plan';render();scrollTo(0,0)};document.getElementById('progressTab').onclick=()=>{tab='progress';render();scrollTo(0,0)};document.getElementById('logTab').onclick=()=>{tab='log';render();scrollTo(0,0)};document.getElementById('nutritionTab').onclick=()=>{tab='nutrition';render();scrollTo(0,0)};document.getElementById('profileTab').onclick=()=>{tab='profile';render();scrollTo(0,0)};render();scrollTo(0,0)};document.getElementById('planTab').onclick=()=>{tab='plan';render();scrollTo(0,0)};document.getElementById('progressTab').onclick=()=>{tab='progress';render();scrollTo(0,0)};render();
</script></main></body></html>
