<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FORM LAB">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>FORM / LAB — твой план</title>
<style>
:root{--bg:#0b0d12;--panel:#151923;--panel2:#1d2330;--text:#f5f7fb;--muted:#9ba5b5;--accent:#b8f36b;--line:#2a3140}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:calc(env(safe-area-inset-top) + 16px) 20px 16px;display:flex;justify-content:space-between;align-items:center}.brand{color:var(--accent);font-size:17px;font-weight:900;letter-spacing:2px}.sub{color:var(--muted);font-size:9px;letter-spacing:2px;margin-top:4px}.avatar{border:1px solid var(--line);background:var(--panel2);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;color:var(--accent);font-weight:900}.nav{display:flex;margin:0 20px;padding:4px;background:var(--panel);border-radius:12px}.nav button{flex:1;border:0;background:none;color:var(--muted);padding:12px;border-radius:9px;font-weight:700}.nav button.active{background:var(--accent);color:var(--bg)}main{padding:22px 20px calc(env(safe-area-inset-bottom) + 28px);max-width:680px;margin:auto}.eyebrow{font-size:10px;font-weight:800;letter-spacing:2px;color:var(--accent);margin-bottom:12px}.h1{font-size:35px;line-height:1.08;font-weight:900;letter-spacing:-1px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px;line-height:1.55}.card,.workout,.notice{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}.label{font-size:10px;font-weight:800;letter-spacing:1.1px;color:var(--muted);margin:16px 0 8px;display:block}.input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:13px;color:var(--text);font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:12px;font-weight:650}.chip.active{border-color:var(--accent);color:var(--accent);background:#29351f}.primary,.secondary{width:100%;border:0;border-radius:12px;padding:16px;font-weight:900;letter-spacing:1px;margin-top:16px}.primary{background:var(--accent);color:var(--bg)}.secondary{border:1px solid var(--line);background:transparent;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:20px 0}.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px}.stat b{display:block;color:var(--accent);font-size:24px}.stat span{font-size:8px;letter-spacing:1px;color:var(--muted)}.workout-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:4px}.day{font-size:9px;color:var(--accent);font-weight:900;letter-spacing:1px;margin-bottom:5px}.workout-title{font-size:16px;font-weight:800}.duration{font-size:10px;color:var(--muted);background:var(--panel2);padding:7px;border-radius:8px}.exercise{display:flex;gap:11px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.exercise:last-child{border-bottom:0}.check{width:22px;height:22px;flex-shrink:0;border:1px solid #596273;border-radius:7px;display:grid;place-items:center;color:var(--bg)}.check.done{background:var(--accent);border-color:var(--accent)}.exname{font-size:13px;font-weight:700}.exname.done{text-decoration:line-through;color:var(--muted)}.meta{font-size:10px;color:var(--muted);margin-top:4px}.exstatus{font-size:8px;color:var(--accent);font-weight:900;margin-left:auto}.notice h3{margin:0 0 8px;font-size:16px}.footer{text-align:center;font-size:9px;color:#596273;letter-spacing:1.5px;margin-top:25px}.hidden{display:none!important}.hint{font-size:11px;line-height:1.5;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<header><div><div class="brand">FORM / LAB</div><div class="sub">ТВОЙ ПЛАН. ТВОЙ ТЕМП.</div></div><div class="avatar" id="avatar">F</div></header>
<div class="nav"><button id="planTab" class="active">План</button><button id="profileTab">Мои данные</button></div>
<main id="app"></main>
<script>
const goals=[['Набрать мышцы','muscle'],['Стать сильнее','strength'],['Похудеть','fat'],['Выносливость','endurance'],['Общая форма','general']];
const places=[['Дома без инвентаря','home'],['Дома с гантелями','dumbbells'],['Тренажёрный зал','gym']];
const levels=[['Новичок','beginner'],['Средний','intermediate'],['Опытный','advanced']];
const defaults={name:'',age:'16',height:'170',weight:'',goal:'general',place:'home',level:'beginner',days:3,minutes:40,limitations:''};
let p={...defaults,...JSON.parse(localStorage.getItem('formlab-profile')||'{}')}, done=JSON.parse(localStorage.getItem('formlab-done')||'{}'), tab='plan';
const catalog={
home:{push:[['Отжимания',3,'6–12 повторений'],['Приседания с весом тела',3,'12–20 повторений'],['Ягодичный мост',3,'12–20 повторений'],['Планка',3,'20–45 секунд'],['Обратные выпады',2,'8–12 на ногу']],pull:[['Тяга рюкзака в наклоне',3,'10–15 повторений'],['«Супермен» лёжа',3,'10–15 повторений'],['Подъёмы на носки',3,'15–25 повторений'],['Dead bug',3,'8–12 на сторону'],['Боковая планка',2,'15–30 секунд на сторону']],full:[['Приседания',3,'12–20 повторений'],['Отжимания от стены/пола',3,'6–12 повторений'],['Обратные выпады',3,'8–12 на ногу'],['Ягодичный мост',3,'12–20 повторений'],['Планка',3,'20–45 секунд']]},
dumbbells:{push:[['Жим гантелей лёжа на полу',3,'8–12 повторений'],['Жим гантелей над головой',3,'8–12 повторений'],['Приседания с гантелью',3,'10–15 повторений'],['Разгибание рук с гантелью',2,'10–15 повторений'],['Планка',3,'20–45 секунд']],pull:[['Тяга гантелей в наклоне',3,'8–12 повторений'],['Румынская тяга с гантелями',3,'8–12 повторений'],['Сгибание рук на бицепс',3,'10–15 повторений'],['Обратные выпады с гантелями',2,'8–12 на ногу'],['Dead bug',3,'8–12 на сторону']],full:[['Приседания с гантелью',3,'10–15 повторений'],['Жим гантелей лёжа на полу',3,'8–12 повторений'],['Тяга гантелей в наклоне',3,'8–12 повторений'],['Румынская тяга',3,'8–12 повторений'],['Планка',3,'20–45 секунд']]},
gym:{push:[['Жим штанги или тренажёра лёжа',3,'6–10 повторений'],['Жим ногами',3,'8–12 повторений'],['Жим гантелей сидя',3,'8–12 повторений'],['Разгибание рук на блоке',2,'10–15 повторений'],['Планка',3,'20–45 секунд']],pull:[['Тяга верхнего блока',3,'8–12 повторений'],['Горизонтальная тяга блока',3,'8–12 повторений'],['Румынская тяга с лёгким весом',3,'8–12 повторений'],['Сгибание рук на бицепс',2,'10–15 повторений'],['Dead bug',3,'8–12 на сторону']],full:[['Присед в тренажёре или гоблет-присед',3,'8–12 повторений'],['Жим тренажёра лёжа',3,'8–12 повторений'],['Тяга верхнего блока',3,'8–12 повторений'],['Сгибание ног в тренажёре',3,'10–15 повторений'],['Планка',3,'20–45 секунд']]}
};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chips(key,arr){return `<div class="chips">${arr.map(([label,value])=>`<button class="chip ${p[key]===value?'active':''}" data-key="${key}" data-value="${value}">${label}</button>`).join('')}</div>`}
function persist(){localStorage.setItem('formlab-profile',JSON.stringify(p));localStorage.setItem('formlab-done',JSON.stringify(done));document.getElementById('avatar').textContent=p.name.trim()?.[0]?.toUpperCase()||'F'}
function profileView(){return `<div class="eyebrow">01 / ПРОФИЛЬ</div><h1 class="h1">Сначала —<br>немного о тебе.</h1><p class="muted">Профиль хранится в локальном хранилище этого браузера и никуда не отправляется.</p><div class="card">
<label class="label">КАК ТЕБЯ НАЗЫВАТЬ</label><input class="input" data-field="name" value="${esc(p.name)}" placeholder="Имя или ник">
<div class="grid"><div><label class="label">ВОЗРАСТ</label><input class="input" data-field="age" type="number" min="10" max="100" value="${esc(p.age)}" placeholder="лет"></div><div><label class="label">РОСТ, СМ</label><input class="input" data-field="height" type="number" value="${esc(p.height)}" placeholder="см"></div></div>
<label class="label">ВЕС, КГ (НЕОБЯЗАТЕЛЬНО)</label><input class="input" data-field="weight" type="number" value="${esc(p.weight)}" placeholder="кг">
<label class="label">ЦЕЛЬ</label>${chips('goal',goals)}<label class="label">ГДЕ ТРЕНИРУЕШЬСЯ</label>${chips('place',places)}<label class="label">ОПЫТ</label>${chips('level',levels)}<label class="label">ТРЕНИРОВОК В НЕДЕЛЮ</label>${chips('days',[2,3,4,5,6].map(n=>[n+' дн.',n]))}<label class="label">СКОЛЬКО ВРЕМЕНИ ЕСТЬ</label>${chips('minutes',[20,30,40,60].map(n=>[n+' мин',n]))}
<label class="label">ОГРАНИЧЕНИЯ ИЛИ ПОЖЕЛАНИЯ</label><textarea class="input" data-field="limitations" rows="2" placeholder="Например: не люблю прыжки">${esc(p.limitations)}</textarea><button class="primary" id="save">СОСТАВИТЬ МОЙ ПЛАН ↗</button></div><p class="hint">Поле ограничений пока не меняет упражнения автоматически. Не выполняй движения, вызывающие боль. Приложение не заменяет консультацию специалиста.</p>`}
function makePlan(){let split=p.days<=3?['full']:['push','pull','full','push','pull','full'];return Array.from({length:p.days},(_,i)=>{let type=split[i%split.length];let ex=catalog[p.place][type].map(x=>[x[0],p.level==='beginner'?Math.min(3,x[1]):x[1],x[2]]);if(p.goal==='endurance')ex=ex.map(x=>[x[0],Math.max(2,x[1]-1),x[0].includes('Планка')?'30–60 секунд':'12–20 повторений']);return {title:p.days<=3?`Тренировка ${i+1} · всё тело`:({push:'Тренировка A · акцент на жим',pull:'Тренировка B · акцент на тягу',full:'Тренировка C · всё тело'}[type]),ex}})}
function planView(){let plans=makePlan(),count=Object.values(done).filter(Boolean).length;return `<div class="eyebrow">02 / ТВОЯ ПРОГРАММА</div><h1 class="h1">${p.name.trim()?esc(p.name)+', твой':'Твой'} план<br>на неделю.</h1><p class="muted">${goals.find(x=>x[1]===p.goal)[0]} · ${levels.find(x=>x[1]===p.level)[0]} · ${p.days} дня в неделю</p><div class="stats"><div class="stat"><b>${p.days}</b><span>ТРЕНИРОВКИ</span></div><div class="stat"><b>${p.minutes}</b><span>МИН / РАЗ</span></div><div class="stat"><b>${count}</b><span>ВЫПОЛНЕНО</span></div></div>${plans.map((day,i)=>`<section class="workout"><div class="workout-head"><div><div class="day">ДЕНЬ ${i+1} / ${String(i+1).padStart(2,'0')}</div><div class="workout-title">${day.title}</div></div><div class="duration">${p.minutes} мин</div></div>${day.ex.map((ex,j)=>{let id=i+'-'+j,is=!!done[id];return `<div class="exercise" data-ex="${id}"><div class="check ${is?'done':''}">${is?'✓':''}</div><div style="flex:1"><div class="exname ${is?'done':''}">${ex[0]}</div><div class="meta">${ex[1]} подхода · ${ex[2]}</div></div><div class="exstatus">${is?'ГОТОВО':'○'}</div></div>`}).join('')}</section>`).join('')}<div class="notice"><h3>Правила прогресса</h3><p class="muted">• Разминка 5–8 минут перед занятием.<br>• Отдыхай 60–120 секунд между подходами.<br>• Не тренируйся через боль.<br>• Увеличивай нагрузку постепенно, сохраняя правильную технику.<br>• Оставляй время на восстановление между тяжёлыми занятиями.</p></div><button class="secondary" id="reset">СБРОСИТЬ ОТМЕТКИ</button><button class="secondary" id="edit">ИЗМЕНИТЬ ПРОФИЛЬ</button><p class="hint">Планы сформированы по простым правилам, это не медицинская оценка. При хронических заболеваниях или боли обсуди нагрузки со специалистом.</p>`}
function render(){persist();document.getElementById('planTab').classList.toggle('active',tab==='plan');document.getElementById('profileTab').classList.toggle('active',tab==='profile');document.getElementById('app').innerHTML=tab==='profile'?profileView():planView();document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{let v=b.dataset.value;try{v=JSON.parse(v)}catch{}p[b.dataset.key]=v;render()});document.querySelectorAll('[data-field]').forEach(el=>el.oninput=()=>{p[el.dataset.field]=el.value;persist()});let save=document.getElementById('save');if(save)save.onclick=()=>{persist();tab='plan';render()};document.querySelectorAll('[data-ex]').forEach(el=>el.onclick=()=>{let id=el.dataset.ex;done[id]=!done[id];persist();render()});let reset=document.getElementById('reset');if(reset)reset.onclick=()=>{if(confirm('Сбросить отметки выполнения?')){done={};persist();render()}};let edit=document.getElementById('edit');if(edit)edit.onclick=()=>{tab='profile';render();scrollTo(0,0)}}
document.getElementById('planTab').onclick=()=>{tab='plan';render();scrollTo(0,0)};document.getElementById('profileTab').onclick=()=>{tab='profile';render();scrollTo(0,0)};render();
</script>
</body></html>
